services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yui
      POSTGRES_PASSWORD: yui_password
      POSTGRES_DB: yui
    ports:
      - "5432:5432"
    volumes:
      - yui_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yui"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  yui_pgdata:
