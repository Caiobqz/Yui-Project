name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic
      - name: Tipagem (mypy)
        run: mypy
      - name: Migrations (encadeamento 0001→head)
        run: DATABASE_URL="sqlite+aiosqlite:///./ci_migrations.db" alembic upgrade head
      - name: Testes
        run: pytest -q
